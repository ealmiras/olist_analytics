models:
  - name: stg_olist__orders
    description: "Staging table for Olist orders data. Center of the star schema, connecting to customers and other related tables."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        data_tests:
          - not_null
          - unique
      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['invoiced', 'created', 'processing', 'canceled', 'delivered', 'approved', 'unavailable', 'shipped']
      - name: order_date
        description: "Timestamp when the order was placed."
        data_tests:
          - not_null
      - name: approved_at
        description: "Timestamp when the order was approved."
      - name: delivered_carrier_at
        description: "Timestamp when the order was delivered to the carrier."
      - name: delivered_customer_at
        description: "Timestamp when the order was delivered to the customer."
      - name: estimated_delivery_at
        description: "Estimated delivery timestamp for the order."

  - name: stg_olist__customers
    description: "Staging table for Olist customers data."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer x order."
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: "Unique identifier for each customer across all orders."
        data_tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "Zip code prefix of the customer's address."
        data_tests:
          - not_null
      - name: customer_city
        description: "City of the customer's address."
        data_tests:
          - not_null
      - name: customer_state
        description: "State of the customer's address."
        data_tests:
          - not_null

  - name: stg_olist__order_items
    description: "Staging table for Olist order items data. Contains details about the products included in each order."
    columns:
      - name: order_id
        description: "Identifier for the order to which the item belongs."
        data_tests:
          - not_null
      - name: item_line_number
        description: "Unique identifier for each item within an order."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier for the product included in the order."
        data_tests:
          - not_null
      - name: seller_id
        description: "Identifier for the seller of the product. Within an order there can be multiple sellers, each selling different products."
        data_tests:
          - not_null
      - name: to_be_shipped_at_limit
        description: "Deadline for shipping the item."
        data_tests:
          - not_null
      - name: item_price
        description: "Price of the item."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: item_freight_value
        description: "Freight cost for the item."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_olist__products
    description: "Staging table for Olist products data. Contains details about the products available in the marketplace."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Category of the product in Portuguese."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_category_name_english
        description: "English translation of product_category_name, joined from the product_category_translations seed. Null if no translation exists for the category."
      - name: product_name_length
        description: "Length of the product name."
      - name: product_description_length
        description: "Length of the product description."
      - name: product_photos_qty
        description: "Number of photos available for the product."
      - name: product_weight_g
        description: "Weight of the product in grams."
      - name: product_length_cm
        description: "Length of the product in centimeters."
      - name: product_height_cm
        description: "Height of the product in centimeters."
      - name: product_width_cm
        description: "Width of the product in centimeters."

  - name: stg_olist__sellers
    description: "Staging table for Olist sellers data."
    columns:
      - name: seller_id
        description: "Unique identifier for each seller."
        data_tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: "Zip code prefix of the seller's address."
        data_tests:
          - not_null
      - name: seller_city
        description: "City of the seller's address."
        data_tests:
          - not_null
      - name: seller_state
        description: "State of the seller's address."
        data_tests:
          - not_null
  
  - name: stg_olist__payments
    description: "Staging table for Olist payments data. Contains details about the payment methods and amounts for each order."
    columns:
      - name: order_id
        description: "Identifier for the order associated with the payment."
        data_tests:
          - not_null
      - name: payment_type
        description: "Type of payment method used."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card']
      - name: total_installments
        description: "Number of installments for the payment."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                config:
                  severity: warn
      - name: installment_number
        description: "Sequential number of the payment for the order."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                config:
                  severity: warn
      - name: payment_value
        description: "Total amount paid for the order."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  
  - name: stg_olist__reviews
    description: "Staging table for Olist reviews data. Contains customer reviews and ratings for each order."
    columns:
      - name: review_id
        description: "Unique identifier for each review."
        data_tests:
          - not_null
      - name: order_id
        description: "Identifier for the order associated with the review."
        data_tests:
          - not_null
      - name: review_score
        description: "Rating given by the customer, on a scale of 1 to 5."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: review_title
        description: "Title of the customer's review comment."
      - name: review_message
        description: "Message content of the customer's review comment."
      - name: review_created_at
        description: "Timestamp when the review was created."
      - name: review_answered_at
        description: "Timestamp when the review was answered."
  
  - name: stg_olist__geolocation
    description: "Staging table for Olist geolocation data."
    columns:
      - name: zip_code_prefix
        description: "Zip code prefix associated with the geolocation."
        data_tests:
          - not_null
      - name: latitude
        description: "Latitude coordinate for the geolocation."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        description: "Longitude coordinate for the geolocation."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: city
        description: "City associated with the geolocation."
        data_tests:
          - not_null
      - name: state
        description: "State associated with the geolocation."
        data_tests:
          - not_null

  - name: stg_olist__closed_deals
    description: "Staging table for Olist closed deals data. Sellers that filled-in requests of contact to sell their products on the marketplace."
    columns:
      - name: lead_id
        description: "Identifier for the marketing qualified lead associated with the closed deal."
        data_tests:
          - not_null
          - unique
      - name: seller_id
        description: "Identifier for the seller associated with the closed deal."
        data_tests:
          - not_null
      - name: sales_dev_rep_id
        description: "Identifier for the sales development representative associated with the closed deal."
        data_tests:
          - not_null
      - name: sales_rep_id
        description: "Identifier for the sales representative associated with the closed deal."
        data_tests:
          - not_null
      - name: closed_date
        description: "Timestamp when the deal was closed."
        data_tests:
          - not_null
      - name: business_segment
        description: "Business segment of the closed deal (e.g., 'home_decor', 'health_beauty', etc.)."
      - name: lead_type
        description: "Type of lead (e.g., 'online_top', 'online_beginner', etc.)."
      - name: lead_behaviour_profile
        description: "Behavior profile of the lead (e.g., 'shark', 'cat', 'eagle', etc.). Could be multiple values separated by commas."
      - name: has_company
        description: "Indicates whether the lead has an associated company (formal documentation). (true/false)"
      - name: has_gtin
        description: "Indicates whether the lead has an associated GTIN (Global Trade Item Number) for their products. (true/false)"    

  - name: stg_olist__marketing_leads
    description: "Staging table for Olist marketing qualified leads data."
    columns:
      - name: lead_id
        description: "Unique identifier for each marketing qualified lead."
        data_tests:
          - not_null
          - unique
      - name: lead_created_at
        description: "Timestamp when the lead was first contacted."
        data_tests:
          - not_null
      - name: landing_page_id
        description: "Identifier for the landing page associated with the lead."
      - name: lead_origin
        description: "Source of the lead (e.g., 'email', 'social_media', 'organic_search')."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic_search', 'paid_search', 'social', 'direct_traffic', 'referral', 'email', 'display', 'other', 'other_publicities', 'unknown']